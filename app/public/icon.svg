<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nexivora">
  <title>Nexivora</title>
  <!--
    PHASE 0 PLACEHOLDER MARK.

    Phase 1 replaces the artwork in this file — but NOT the URL. Per the Google
    favicon guidance (../SEO IMPs/Fevicon.txt) the icon must live on a stable URL
    that never changes once indexed, so /icon.svg is claimed now and kept forever.

    The form: three nodes joined by two strokes, reading simultaneously as a
